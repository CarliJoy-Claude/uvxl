# Isolated Claude Code for this workspace, controlled from claude.ai/code or
# the Claude app (remote control mode). See docker/README.md.
name: locked-install

services:
  claude:
    build:
      context: docker
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: locked-install-claude
    hostname: locked-install
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    working_dir: /workspace
    command:
      - claude
      - remote-control
      - --name
      - locked-install
      - --permission-mode
      - ${CLAUDE_PERMISSION_MODE:-acceptEdits}
    # Local, git-ignored settings (git identity and more), passed into the
    # container. Compose also reads .env for the ${...} values in this file.
    env_file:
      - path: .env
        required: false
    environment:
      CLAUDE_CONFIG_DIR: /home/dev/.claude-config
      DISABLE_AUTOUPDATER: "1"
      # The host's .venv points at host interpreters; use one inside the container.
      UV_PROJECT_ENVIRONMENT: /home/dev/venv
      UV_CACHE_DIR: /home/dev/.cache/uv
      CARGO_TARGET_DIR: /home/dev/cargo-target
    volumes:
      # Only the project is shared with the host.
      - .:/workspace
      # Login and settings survive container rebuilds.
      - claude-config:/home/dev/.claude-config
      # Container-only build state, kept apart from the host's .venv and target/.
      - venv:/home/dev/venv
      - uv-cache:/home/dev/.cache/uv
      - cargo-target:/home/dev/cargo-target
      - cargo-registry:/opt/cargo/registry

volumes:
  claude-config:
  venv:
  uv-cache:
  cargo-target:
  cargo-registry:
