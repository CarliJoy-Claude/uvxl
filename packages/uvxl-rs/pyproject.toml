[project]
name = "uvxl-rs"
version = "0.1.0"
description = "PoC: install and run a Python application with the lock linked from its Pylock Project-URL (Rust implementation on the uv crates; placeholder)"
readme = "README.md"
requires-python = ">=3.12"

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"

[tool.uv]
# Rebuild the wheel when the Rust sources change, not only pyproject.toml.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
