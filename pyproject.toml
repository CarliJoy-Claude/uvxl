# Virtual workspace root: no [project], only shared configuration.
# Dependencies of the packages live in packages/*/pyproject.toml.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "coverage>=7.10",
    "mypy>=2.4",
    "prek>=0.5",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["packages/uvxl/src", "packages/uvxl-py/src", "tests"]

[tool.ruff.lint]
# Rule set of https://github.com/CarliJoy/uvrev, plus SIM108 ignored
# because the project's conventions forbid the ternary operator.
select = [
    "F",     # Pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "RUF",   # Ruff-specific rules
    # Security related
    "S",     # flake8-bandit
    "ASYNC", # flake8-async
    "BLE",   # flake8-blind-except
    "DTZ",   # flake8-datetimez
    "G",     # flake8-logging-format
    "LOG",   # flake8-logging
    "PGH",   # pygrep-hooks (no blanket noqa / type: ignore)
    "T10",   # flake8-debugger
    "YTT",   # flake8-2020
    # Correctness and style
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "ERA",   # eradicate (commented-out code)
    "EXE",   # flake8-executable
    "FA",    # flake8-future-annotations
    "FURB",  # refurb
    "ICN",   # flake8-import-conventions
    "ISC",   # flake8-implicit-str-concat
    "N",     # pep8-naming
    "PERF",  # Perflint
    "PIE",   # flake8-pie
    "PL",    # Pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops
]
ignore = [
    "E203",    # whitespace before ':' (Black compatibility)
    "E266",    # too many leading '#' for block comment
    "E501",    # line length handled by formatter
    # Flags every subprocess call. All calls pass argument tuples, never shell=True,
    # so there is no shell injection. S602/S604/S605 still catch shell usage.
    "S603",
    "PLR0913", # too many arguments: click commands get one parameter per option
    "PLR0917", # too many positional arguments: same as PLR0913
    "TRY003",  # long messages in raise: the code base uses descriptive messages
    "SIM108",  # suggests the ternary operator, which the conventions forbid
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Tests can be more permissive
"**/tests/**" = [
    "S101",    # assert usage
    "PLR2004", # magic values
    "S607",    # uv is started from PATH
    "ARG",     # fixtures are often requested only for their side effects
]

[tool.mypy]
strict = true
files = ["packages/uvxl/src", "packages/uvxl-py/src", "tests"]
python_version = "3.12"
mypy_path = ["packages/uvxl/src", "packages/uvxl-py/src", "tests"]
explicit_package_bases = true

[tool.coverage.run]
branch = true
source_pkgs = ["uvxl", "uvxl_py"]
parallel = true
# The shared backend suite runs `python -m uvxl` in subprocesses.
patch = ["subprocess"]

# CI tests the installed (non-editable) packages: report them as source files
[tool.coverage.paths]
uvxl = ["packages/uvxl/src/uvxl", "*/site-packages/uvxl"]
uvxl_py = ["packages/uvxl-py/src/uvxl_py", "*/site-packages/uvxl_py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "assert_never\\(.*\\)",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
