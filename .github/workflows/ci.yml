name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml builds and tests through this workflow, with the tag as version.
  workflow_call:
    inputs:
      version:
        description: "Release version (git tag like v1.2.3); empty for development builds"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.99"
  CARGO_TERM_COLOR: always
  PYTHONUTF8: "1"

jobs:
  # ------------------------------------------------------------------------
  # prek groups `lint` and `test` (.pre-commit-config.yaml), as run locally:
  # ruff, mypy, cargo fmt/clippy/test, pytest with Python coverage (100%)
  # and Rust coverage of an instrumented uvxl-rs.
  # ------------------------------------------------------------------------
  checks:
    runs-on: ubuntu-latest
    env:
      # The hooks call `uv run`; the environment is installed once below.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs the history for the version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/uvxl-rs
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: astral-sh/setup-uv@v10.3.3 # no moving major tags
        with:
          python-version: "3.12"
          enable-cache: true
      # uvxl-rs comes from the instrumented build of the tests hook, so the
      # release build is not needed here.
      - run: uv sync --locked --no-install-package uvxl-rs
      - name: prek group lint
        run: uv run prek run --all-files --show-diff-on-failure --group lint
      - name: prek group test
        if: success() || failure()
        run: uv run prek run --all-files --group test
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Tests"
            echo '```'
            grep -E "passed|failed|error" rust-coverage.txt | tail -n 1 || true
            echo '```'
            echo "## Python coverage"
            echo '```'
            cat python-coverage.txt 2>/dev/null || echo "no report"
            echo '```'
            echo "## Rust coverage (own code, gated at 100% of lines)"
            echo '```'
            sed -n '/^Filename/,/^TOTAL/p' rust-coverage.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            junit.xml
            htmlcov/
            coverage.xml
          if-no-files-found: ignore

  # ------------------------------------------------------------------------
  # Distributions: prek group `build` (sdists and pure wheels), and uvxl-rs
  # wheels per platform (maturin-action, as prek cannot cross-compile).
  # ------------------------------------------------------------------------
  build-pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3 # no moving major tags
        with:
          python-version: "3.12"
      - name: Set the uvxl-rs version from the tag
        if: inputs.version != ''
        run: uv run --no-project python scripts/set-rust-version.py "${{ inputs.version }}"
      # Only the dev group (prek): the workspace packages are not needed.
      - name: prek group build
        run: uv run --locked --only-group dev prek run --all-files --group build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-pure
          path: dist/

  build-rust:
    name: build-rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-latest, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set the uvxl-rs version from the tag
        if: inputs.version != ''
        shell: bash
        run: python scripts/set-rust-version.py "${{ inputs.version }}"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: packages/uvxl-rs
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --release --locked --out dist
          sccache: "true"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-rust-${{ matrix.name }}
          path: packages/uvxl-rs/dist/

  # ------------------------------------------------------------------------
  # The built wheels, installed into a fresh environment, on every OS and
  # Python: the whole test suite against the installed packages.
  # ------------------------------------------------------------------------
  test-wheels:
    name: test-wheels (${{ matrix.os }}, ${{ matrix.python }})
    needs: [build-pure, build-rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - { os: ubuntu-latest, wheel: linux-x86_64 }
          - { os: macos-latest, wheel: macos-arm64 }
          - { os: windows-latest, wheel: windows-x64 }
    steps:
      - uses: actions/checkout@v7 # the tests and the fake package sources
      - uses: astral-sh/setup-uv@v10.3.3 # no moving major tags
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: dist-pure
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: dist-rust-${{ matrix.wheel }}
          path: dist
      # prek runs from a dev group environment; the hook installs the wheels
      # into an environment of its own.
      - name: prek hook test-wheels
        shell: bash # Git Bash on Windows, so the hook finds it, not WSL's bash
        env:
          UV_PYTHON: ${{ matrix.python }} # the dev and the test environment
        run: uv run --locked --only-group dev prek run --all-files --stage manual test-wheels
