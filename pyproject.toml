# Virtual workspace root: no [project], only shared configuration.
# Dependencies of the packages live in packages/*/pyproject.toml.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["packages/uvxl-py/src", "packages/uvxl-py/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL"]
ignore = ["SIM108", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["packages/uvxl-py/src", "packages/uvxl-py/tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["packages/uvxl-py/tests"]
addopts = ["-ra"]
